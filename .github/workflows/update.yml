name: Weekly data update

on:
  schedule:
    # Tuesdays 11:17 UTC (7:17am Eastern during the season), after Monday Night Football
    - cron: '17 11 * * 2'
    # Fridays 11:17 UTC, picks up Thursday Night Football
    - cron: '17 11 * * 5'
  workflow_dispatch: {}   # lets you run it any time from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Cache old seasons
        uses: actions/cache@v4
        with:
          path: data
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-
      - run: npm install --no-audit --no-fund
      - run: pip install -r requirements.txt
      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build
      - name: Commit if anything changed
        run: |
          git config user.name "clocked-bot"
          git config user.email "clocked-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No changes" || (git commit -m "Weekly data update" && git push)
